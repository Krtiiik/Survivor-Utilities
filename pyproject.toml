[project]
name = "survivor-utilities"
version = "0.1.0"
description = "Desktop app for running a Kruh-based team-building event (\"Survivor\"): headcount counting, team/subteam distribution, and timetable generation."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "ortools>=9.10,<10",
    "xlsxwriter>=3.2,<4",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10,<7",
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["survivor_app*"]
